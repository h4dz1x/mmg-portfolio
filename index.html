<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mastermind — Logo Wall</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

  .logo-wall,
  .logo-wall *,
  .logo-wall *::before,
  .logo-wall *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .logo-wall {
    --ink: #15131c;
    --bg-card: #ffffff;
    --lw-gap: 64px;
    --lw-row-gap: 36px;
    --lw-speed-1: 60s;
    --lw-speed-2: 56s;
    --lw-slot-w: 150px;
    --lw-slot-h: 56px;

    font-family: "DM Sans", sans-serif;
    color: var(--ink);
    background: var(--bg-card);
    border-radius: 0;
    width: 100%;
    padding: 64px 0 56px;
    overflow: hidden;
  }

  .logo-wall__lead {
    padding: 0 72px;
    margin-bottom: 48px;
    max-width: 520px;
    font-size: 0.9375rem;
    line-height: 1.65;
    color: rgba(15, 13, 28, 0.55);
    font-weight: 400;
    letter-spacing: -0.005em;
  }

  /* ── Marquee ── */
  .logo-marquee {
    position: relative;
    overflow: hidden;
    width: 100%;
  }
  .logo-marquee + .logo-marquee {
    margin-top: var(--lw-row-gap);
  }

  .logo-marquee__track {
    display: flex;
    width: max-content;
    align-items: center;
    gap: var(--lw-gap);
    padding-right: var(--lw-gap);
    will-change: transform;
  }

  .logo-marquee--left .logo-marquee__track {
    animation: lw-scroll-left var(--lw-speed-1) linear infinite;
  }
  .logo-marquee--right .logo-marquee__track {
    animation: lw-scroll-right var(--lw-speed-2) linear infinite;
  }
  .logo-marquee:hover .logo-marquee__track {
    animation-play-state: paused;
  }

  @keyframes lw-scroll-left {
    from {
      transform: translate3d(0, 0, 0);
    }
    to {
      transform: translate3d(-25%, 0, 0);
    }
  }
  @keyframes lw-scroll-right {
    from {
      transform: translate3d(-25%, 0, 0);
    }
    to {
      transform: translate3d(0, 0, 0);
    }
  }

  /* ── Logo item — slot box: svaki logo dobija isti "kontejner" ── */
  .logo-item {
    flex: 0 0 auto;
    width: var(--lw-slot-w);
    height: var(--lw-slot-h);
    background-size: contain;
    background-position: center center;
    background-repeat: no-repeat;
    filter: grayscale(1) brightness(0);
    opacity: 0.55;
    transition:
      opacity 0.3s ease,
      filter 0.3s ease;
  }
  .logo-item:hover {
    opacity: 0.9;
  }

  /* Optical sizing — kvadratni / visoki logoi dobijaju uži slot da ne djeluju ogromno */
  .logo-item--square {
    width: calc(var(--lw-slot-w) * 0.55);
    height: calc(var(--lw-slot-h) * 1.15);
  }
  .logo-item--tall {
    width: calc(var(--lw-slot-w) * 0.42);
    height: calc(var(--lw-slot-h) * 1.3);
  }
  /* Široki logoi — daj im više širine */
  .logo-item--wide {
    width: calc(var(--lw-slot-w) * 1.2);
    height: calc(var(--lw-slot-h) * 0.85);
  }
  /* Logoi sa puno internog paddinga / tankim glifima — povećaj slot */
  .logo-item--big {
    width: calc(var(--lw-slot-w) * 1.3);
    height: calc(var(--lw-slot-h) * 1.25);
  }
  /* Specifično Ministarstvo dijaspore — još 20% iznad --big */
  .logo-item--xbig {
    width: calc(var(--lw-slot-w) * 1.56);
    height: calc(var(--lw-slot-h) * 1.5);
  }

  /* Logoi koji su raster (PNG/JPG) sa svojom bijelom pozadinom */
  .logo-item--raster {
    filter: grayscale(1) contrast(1.05);
    mix-blend-mode: multiply;
    opacity: 0.75;
  }
  .logo-item--raster:hover {
    opacity: 0.95;
  }

  /* Raster logoi sa tankim glifima — samo pojačan kontrast i opacity */
  .logo-item--raster-strong {
    filter: grayscale(1) contrast(1.6);
    mix-blend-mode: multiply;
    opacity: 1;
  }
  .logo-item--raster-strong:hover {
    filter: grayscale(1) contrast(1.8);
  }

  /* UNDP / složeni kolorni SVG sa bijelim slovima — ne smije brightness(0) */
  .logo-item--color {
    filter: grayscale(1);
    opacity: 0.7;
  }
  .logo-item--color:hover {
    opacity: 0.95;
  }

  /* ── Logo registry (svaki data URI postoji JEDNOM ovdje) ── */
  .lg-iom {
    --ar: 2.5806;
    background-image: url("assets/logos/iom.svg");

  }
  .lg-prijestonica {

  }
  .lg-gradjanska {
    --ar: 2.1622;

  }
  .lg-czk-plav {

  }
  .lg-zavod-tk {
    --ar: 1.5385;
    background-image: url("assets/logos/zavod-tk.jpg");
  }
  .lg-privredna {
    --ar: 1;
    background-image: url("assets/logos/privredna.svg");
  }
  .lg-beerfest {
    --ar: 1.1765;
    background-image: url("assets/logos/beerfest.svg");
  }
  .lg-dsd {
    --ar: 1;
    background-image: url("assets/logos/dsd.png");
  }
  .lg-maestral {
    --ar: 1.4545;
    background-image: url("assets/logos/maestral.svg");
  }
  .lg-profhilo {
    --ar: 2.6316;
    background-image: url("assets/logos/profhilo.png");
  }
  .lg-mesoestetic {
    --ar: 1.0811;
    background-image: url("assets/logos/mesoestetic.svg");
  }
  .lg-malfy {
    --ar: 1.8605;
    background-image: url("assets/logos/malfy.svg");
  }
  .lg-green-city {
    --ar: 1;
    background-image: url("assets/logos/green-city.png");
  }
  .lg-dr-danica {
    --ar: 0.9091;
    background-image: url("assets/logos/dr-danica.svg");

  .lg-montebar {

  .lg-hl2 {

  }

  @media (prefers-reduced-motion: reduce) {
    .logo-marquee--left .logo-marquee__track,
    .logo-marquee--right .logo-marquee__track {
      animation: none;
      transform: none;
    }
  }

  /* ── Responsive ── */
  @media (max-width: 1200px) {
    .logo-wall {
      padding: 56px 0 48px;
    }
    .logo-wall__lead {
      padding: 0 40px;
      margin-bottom: 40px;
    }
    .logo-wall {
      --lw-gap: 56px;
      --lw-row-gap: 30px;
      --lw-slot-w: 134px;
      --lw-slot-h: 52px;
    }
  }
  @media (max-width: 900px) {
    .logo-wall {
      padding: 48px 0 40px;
    }
    .logo-wall__lead {
      padding: 0 24px;
      margin-bottom: 32px;
      font-size: 0.875rem;
      max-width: 100%;
    }
    .logo-wall {
      --lw-gap: 44px;
      --lw-row-gap: 26px;
      --lw-slot-w: 116px;
      --lw-slot-h: 46px;
      --lw-speed-1: 48s;
      --lw-speed-2: 44s;
    }
  }
  @media (max-width: 560px) {
    .logo-wall {
      padding: 36px 0 28px;
    }
    .logo-wall__lead {
      padding: 0 20px;
      margin-bottom: 24px;
    }
    .logo-wall {
      --lw-gap: 32px;
      --lw-row-gap: 20px;
      --lw-slot-w: 96px;
      --lw-slot-h: 38px;
      --lw-speed-1: 36s;
      --lw-speed-2: 32s;
    }
  }
</style>
</head>
